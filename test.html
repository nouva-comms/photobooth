                    <img class="w-full h-full object-cover" data-alt="Celebratory guest throwing peace signs at studio camera, bright aesthetic, soft shadow details, photobooth snapshot with warm natural palette." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAFTiTUNAnx0uE2EquN_BtEF3zHiq-Y8VzVH--1fa4B-9QQVeq89UbsWUB0UFyLsyZAdj3vcdpc5xIXLd79Cm6k8yFa_QuhcPTp-MJaDW0y2rLuW8S7FMub0SREJZyEkJHIylC4_7PBpvzgglqyAW-I2Kf0HEYo-xWJ32yKTc-cm_-GEe0stX7RA9MaoPwGqnUpKEnkmWupdwFzRgyG_UjHON9yeI8pAvn8Qq1yy653Ak5W-Hm0hEG4" />

                    <span class="font-headline-md text-label-md text-on-surface-variant/40 tracking-widest font-semibold uppercase">LUMINA</span>

            <div class="flex flex-col items-center text-center space-y-space-xs max-w-xl">
              <h1 class="font-headline-lg text-display-sm text-on-surface tracking-tight font-semibold"> Ready for your photos? </h1>
              <p class="font-body-lg text-body-lg text-on-surface-variant"> Tap anywhere or press <span class="inline-flex items-center px-2 py-0.5 rounded-lg bg-surface-container text-on-surface font-label-md text-label-md font-semibold mx-1 shadow-sm">Space</span> to begin </p>
            </div>
            <div class="mt-space-xl flex flex-col items-center">
              <button class="group relative flex items-center gap-space-md bg-primary hover:bg-secondary-container active:scale-95 text-on-primary font-label-lg text-label-lg px-space-xl py-4 rounded-full shadow-[0_12px_32px_-4px_rgba(29,78,216,0.35)] hover:shadow-[0_16px_40px_-4px_rgba(29,78,216,0.45)] transition-all duration-300" id="start-btn">
                <span class="flex items-center justify-center w-8 h-8 rounded-full bg-on-primary/15 group-hover:bg-on-primary/25 transition-colors">
                  <span class="material-symbols-outlined text-[20px] text-on-primary">photo_camera</span>
                </span>
                <span class="font-semibold tracking-wide">Start Photo Session</span>
                <span class="hidden sm:inline-block ml-2 px-2.5 py-1 rounded-full bg-on-primary/20 text-on-primary font-label-md text-label-md font-medium tracking-normal"> Space </span>
              </button>
            </div>
          </div>
          <div class="relative z-10 w-full flex flex-col sm:flex-row items-center justify-center gap-space-xs text-center py-space-sm text-on-surface-variant/70 font-label-md text-label-md">
            <span class="inline-flex items-center gap-space-xs">
              <span class="w-1.5 h-1.5 rounded-full bg-primary/70"></span>
              <span>Photo Booth Ready</span>
            </span>
            <span class="hidden sm:inline opacity-40">•</span>
            <span>Touch anywhere to start</span>
          </div>
          <div class="fixed inset-0 bg-surface-container-lowest pointer-events-none opacity-0 transition-opacity duration-300 z-50" id="flash-effect"></div>
        </div>
        <script>
          (function() {
            const startBtn = document.getElementById('start-btn');
            const interactiveScreen = document.getElementById('interactive-screen');
            const flashEffect = document.getElementById('flash-effect');

            function triggerStart() {
              if (!flashEffect) return;
              flashEffect.style.opacity = '0.9';
              setTimeout(() => {
                flashEffect.style.opacity = '0';
              }, 220);
            }
            if (startBtn) {
              startBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                triggerStart();
              });
            }
            if (interactiveScreen) {
              interactiveScreen.addEventListener('click', function() {
                triggerStart();
              });
            }
            window.addEventListener('keydown', function(e) {
              if (e.code === 'Space' || e.key === ' ') {
                e.preventDefault();
                triggerStart();
              }
            });
          })();
        </script>

        <div class="flex items-center gap-space-xs pointer-events-auto">
          <span class="material-symbols-outlined text-[16px] text-primary">photo_camera</span>
          <span>Touchscreen Ready</span>
        </div>
        <div class="pointer-events-auto flex items-center gap-space-md">
          <span class="uppercase tracking-wider">Lumina OS • 60 FPS</span>
        </div>
      </div>
    </footer>
